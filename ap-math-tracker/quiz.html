<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="AP Precalculus and AP Calculus AB quizzes and tests with automatic correction.">
<title>AP Math Quizzes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
/* Layout: one column, one question per screen on phones; same tokens as the tracker */
:root{
  --bg:#EEF2F6; --paper:#FFFFFF; --grid:#DCE4EE; --ink:#16223A; --muted:#5B6880; --line:#CDD6E2;
  --accent:#2A55D9; --accent-ink:#FFFFFF; --hl:#F4C430; --bad:#C2412D; --good:#1F6F4A; --good-bg:#E3F2EA; --bad-bg:#FBE9E5;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --paper:#171F30; --grid:#1D2738; --ink:#E6ECF5; --muted:#93A0B8; --line:#2A3650;
  --accent:#7D9BFF; --accent-ink:#0F1522; --hl:#E8B92E; --bad:#F07560; --good:#5CC48E; --good-bg:#16352A; --bad-bg:#3D1F1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1522; --paper:#171F30; --grid:#1D2738; --ink:#E6ECF5; --muted:#93A0B8; --line:#2A3650;
  --accent:#7D9BFF; --accent-ink:#0F1522; --hl:#E8B92E; --bad:#F07560; --good:#5CC48E; --good-bg:#16352A; --bad-bg:#3D1F1A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.6rem}h2{font-size:1.2rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
label.f{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.banner{background:var(--hl);color:#16223A;border-radius:8px;padding:8px 12px;font-size:.9rem}
.err{color:var(--bad);font-weight:700;font-size:.9rem}
.course{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.course button{border:0;background:none;color:var(--ink);font:inherit;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer}
.course button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.list{display:grid;gap:8px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.qrow small{grid-column:1;color:var(--muted);font-size:.82rem}
.chip{display:inline-flex;align-items:center;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip.good{color:var(--good);border-color:var(--good)}.chip.mid{color:#9a6a00;border-color:var(--hl)}.chip.bad{color:var(--bad);border-color:var(--bad)}
.chip.test{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.calc{font-size:.7rem;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:4px;background:var(--line);color:var(--muted)}
.calc.on{background:var(--accent);color:var(--accent-ink)}
.stem{font-size:1.02rem;min-width:0;overflow-wrap:anywhere}
.stem .tbl,.exp .tbl{overflow-x:auto;margin:8px 0}
.stem table,.exp table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.stem td,.exp td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.stem tr:first-child td{font-weight:700}
.fig{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;justify-content:center}
.fig img{width:100%;max-width:460px;height:auto}
.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:2em 1fr;gap:8px;align-items:center;text-align:left;font:inherit;color:inherit;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:48px}
.choice .l{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice:disabled{cursor:default}
.exp{border-left:4px solid var(--good);background:var(--good-bg);padding:10px 12px;border-radius:0 8px 8px 0}
.exp.no{border-left-color:var(--bad);background:var(--bad-bg)}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font:inherit;font-family:var(--f-mono);font-size:.82rem;cursor:pointer;color:var(--ink)}
.dot.ans{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dot.cur{outline:3px solid var(--hl)}
.timer{font-family:var(--f-mono);font-weight:700;padding:4px 10px;border-radius:6px;background:var(--ink);color:var(--bg)}
.timer.low{background:var(--bad);color:#fff}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-weight:700;font-size:3rem;line-height:1}
.rev{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.confirm{border:2px solid var(--bad);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--paper)}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><div class="label">AP Math Tracker</div><h1>AP Math Quizzes</h1></div>
    <div id="who" class="muted" style="font-size:.9rem"></div>
  </header>
  <main id="main"><div class="panel"><p class="muted">Loading…</p></div></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="quiz-config.js?v=1"></script>
<script src="quiz-bank.js?v=1"></script>
<script>
const CFG=window.QUIZ_CONFIG||{endpoint:""},BANK=window.QUIZ_BANK||[];
const COURSE={pc:"AP Precalculus",ab:"AP Calculus AB"};
const UNIT={pc:{u1:"Unit 1 · Polynomial and Rational Functions"},ab:{u1:"Unit 1 · Limits, Continuity, and Differentiability"}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem("apq."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("apq."+k,JSON.stringify(v))}catch(e){}}};
const S={me:LS.get("me",null),course:LS.get("course","pc"),run:null,results:LS.get("results",{})};
const online=!!CFG.endpoint;

function math(el){try{renderMathInElement(el,{delimiters:[{left:"$",right:"$",display:false}],throwOnError:false})}catch(e){}}
function uid(){return (crypto.randomUUID&&crypto.randomUUID())||Date.now().toString(36)+Math.random().toString(36).slice(2)}
async function post(o){const r=await fetch(CFG.endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)});return r.json()}

/* ---------- sending results (queued when offline) ---------- */
async function flush(){
  if(!online||!S.me)return;
  const q=LS.get("pending",[]);if(!q.length)return;
  const left=[];
  for(const p of q){try{const R=await post(p);if(!(R&&R.ok))left.push(p)}catch(e){left.push(p)}}
  LS.set("pending",left);
}
async function send(payload){
  if(!online)return "practice";
  try{const R=await post(payload);if(R&&R.ok)return "sent";if(R&&R.error==="code")return "code";throw 0}
  catch(e){const q=LS.get("pending",[]);q.push(payload);LS.set("pending",q);return "queued"}
}

/* ---------- screens ---------- */
function who(){$("#who").innerHTML=S.me?`${esc(S.me.name)} · <button class="btn sm" id="signout">Change</button>`:""}
function signin(msg,nm,cc){
  who();
  $("#main").innerHTML=`<div class="panel">
    <h2>Sign in</h2>
    <p class="muted" style="margin:0">Enter your full name and the class code your teacher gave you. Your results are sent to your teacher.</p>
    ${online?"":'<div class="banner"><b>Practice mode.</b> Results are not sent yet; you still get your score and corrections.</div>'}
    <form id="si" style="display:grid;gap:12px">
      <label class="f" for="nm">Full name<input id="nm" autocomplete="name" required maxlength="60" value="${esc(nm??S.me?.name??"")}"></label>
      <label class="f" for="cc">Class code<input id="cc" autocomplete="off" autocapitalize="characters" ${online?"required":""} maxlength="30" value="${esc(cc??S.me?.code??"")}"></label>
      ${msg?`<div class="err">${esc(msg)}</div>`:""}
      <button class="btn primary" type="submit" id="go">Continue</button>
    </form></div>`;
}
async function doSignin(name,code){
  if(!online){S.me={name,code};LS.set("me",S.me);return home()}
  $("#go").disabled=true;$("#go").textContent="Checking…";
  try{const R=await post({action:"check",code});
    if(R&&R.ok){S.me={name,code,cls:R.className||""};LS.set("me",S.me);flush();return home()}
    signin("This class code is not recognized. Check it with your teacher.",name,"")}
  catch(e){S.me={name,code};LS.set("me",S.me);home(true)}
}
function badge(id){const r=S.results[id];if(!r)return "";const p=r.best;return `<span class="chip ${p>=80?"good":p>=60?"mid":"bad"}">Best ${p}%</span>`}
function home(offline){
  who();
  const list=BANK.filter(b=>b.course===S.course);
  const units=[...new Set(list.map(b=>b.unit))];
  $("#main").innerHTML=`<div style="display:grid;gap:16px">
    ${offline?'<div class="banner">You seem to be offline. You can take quizzes; results will be sent when you are back online.</div>':""}
    ${online?"":'<div class="banner"><b>Practice mode.</b> Results are not sent to your teacher yet.</div>'}
    <div class="course" role="group" aria-label="Course">${Object.keys(COURSE).map(c=>`<button data-course="${c}" aria-pressed="${c===S.course}">${COURSE[c]}</button>`).join("")}</div>
    ${units.map(u=>{const qs=list.filter(b=>b.unit===u);return `<section class="panel"><h2>${esc((UNIT[S.course]||{})[u]||u)}</h2>
      <div class="label">Tests (timed, corrected at the end)</div>
      <div class="list">${qs.filter(b=>b.kind==="test").map(b=>row(b)).join("")}</div>
      <div class="label">Quizzes (instant feedback)</div>
      <div class="list">${qs.filter(b=>b.kind==="quiz").map(b=>row(b)).join("")}</div></section>`}).join("")}
  </div>`;
}
function row(b){return `<button class="qrow" data-open="${b.id}"><span><b>${esc(b.title)}</b></span><span style="display:flex;gap:6px">${b.kind==="test"?'<span class="chip test">Test</span>':""}${badge(b.id)}</span><small>${b.items.length} questions${b.minutes?` · ${b.minutes} min`:""}</small></button>`}

/* ---------- running a quiz or test ---------- */
function start(id){
  const b=BANK.find(x=>x.id===id);if(!b)return home();
  const saved=LS.get("run",null);
  if(saved&&saved.id===id&&b.kind==="test"&&Date.now()<saved.end){S.run={...saved,b}}
  else S.run={id,b,i:0,ans:Array(b.items.length).fill(null),lock:Array(b.items.length).fill(false),t0:Date.now(),end:b.minutes?Date.now()+b.minutes*60000:0,confirm:false};
  try{history.replaceState(null,"","#"+id)}catch(e){}
  view();
}
function save(){if(S.run&&S.run.b.kind==="test"){const {b,...r}=S.run;LS.set("run",r)}}
let tick=null;
function view(){
  const R=S.run,b=R.b,it=b.items[R.i],test=b.kind==="test",n=b.items.length;
  clearInterval(tick);
  const answered=R.ans.filter(a=>a!=null).length;
  $("#main").innerHTML=`<div class="panel">
    <div class="qhead"><div><div class="label">${esc(b.title)}</div><span class="num muted">Question ${R.i+1} of ${n}</span></div>
      <div style="display:flex;gap:8px;align-items:center">${test?`<span class="timer" id="tm"></span>`:""}<button class="btn sm" id="quit">Exit</button></div></div>
    <div class="bar"><i style="width:${(test?answered:R.i)/n*100}%"></i></div>
    <div><span class="calc ${it.calc?"on":""}">${it.calc?"CALCULATOR":"NO CALCULATOR"}</span></div>
    <div class="stem" id="stem">${it.q}</div>
    ${it.img.map(src=>`<div class="fig"><img src="quiz-img/${src}" alt="Graph for question ${R.i+1}"></div>`).join("")}
    <div class="choices">${it.c.map((c,k)=>{
      let cls="";if(!test&&R.lock[R.i]){if(k===it.a)cls="right";else if(k===R.ans[R.i])cls="wrong"}
      return `<button class="choice ${cls}" data-pick="${k}" aria-pressed="${R.ans[R.i]===k}" ${!test&&R.lock[R.i]?"disabled":""}><span class="l">${"ABCD"[k]}</span><span>${c}</span></button>`}).join("")}</div>
    ${!test&&R.lock[R.i]?`<div class="exp ${R.ans[R.i]===it.a?"":"no"}"><b>${R.ans[R.i]===it.a?"Correct.":"Not quite. The answer is ("+"ABCD"[it.a]+")."}</b> ${it.e}</div>`:""}
    ${test?`<div class="dots">${b.items.map((_,k)=>`<button class="dot ${R.ans[k]!=null?"ans":""} ${k===R.i?"cur":""}" data-go="${k}" aria-label="Question ${k+1}">${k+1}</button>`).join("")}</div>`:""}
    ${R.confirm?`<div class="confirm"><b>Submit your test?</b><span>${n-answered?`You have ${n-answered} unanswered question${n-answered>1?"s":""}. Unanswered questions count as wrong.`:"All questions are answered."}</span><div class="nav"><button class="btn" id="cancel">Keep working</button><button class="btn primary" id="finish">Submit test</button></div></div>`:""}
    <div class="nav">
      ${test?`<button class="btn" id="prev" ${R.i===0?"disabled":""}>Previous</button>`:"<span></span>"}
      ${test?(R.i<n-1?`<button class="btn primary" id="next">Next</button>`:`<button class="btn primary" id="ask">Submit test</button>`)
            :(R.lock[R.i]?`<button class="btn primary" id="next">${R.i<n-1?"Next question":"See my score"}</button>`:`<button class="btn primary" id="check" ${R.ans[R.i]==null?"disabled":""}>Check answer</button>`)}
    </div></div>`;
  math($("#main"));
  if(test){const upd=()=>{const left=Math.max(0,R.end-Date.now()),m=Math.floor(left/60000),s=Math.floor(left/1000)%60;const el=$("#tm");if(el){el.textContent=`${m}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",left<60000)}if(left<=0){clearInterval(tick);finish(true)}};upd();tick=setInterval(upd,1000)}
  window.scrollTo({top:0});
}
async function finish(timeUp){
  clearInterval(tick);
  const R=S.run,b=R.b,n=b.items.length;
  const right=b.items.reduce((s,it,k)=>s+(R.ans[k]===it.a?1:0),0),pct=Math.round(100*right/n);
  const secs=Math.round((Date.now()-R.t0)/1000);
  const prev=S.results[b.id]||{best:0,tries:0};S.results[b.id]={best:Math.max(prev.best,pct),last:pct,tries:prev.tries+1,at:new Date().toISOString()};LS.set("results",S.results);
  LS.set("run",null);
  const payload={action:"submit",id:uid(),name:S.me.name,code:S.me.code,course:b.course,unit:b.unit,quiz:b.id,title:b.title,kind:b.kind,score:right,total:n,percent:pct,seconds:secs,answers:R.ans.map(a=>a==null?"":"ABCD"[a]).join(""),client:new Date().toISOString()};
  results(b,R,right,pct,timeUp,"sending");
  const st=await send(payload);
  const el=$("#sendst");if(el)el.innerHTML=sendText(st);
}
function sendText(st){return {practice:"Practice mode: this result was not sent.",sent:"✓ Sent to your teacher.",queued:"Saved on this device. It will be sent when you are online.",code:"Your class code was refused. Sign in again with the right code.",sending:"Sending to your teacher…"}[st]}
function results(b,R,right,pct,timeUp,st){
  const n=b.items.length;
  $("#main").innerHTML=`<div class="panel">
    <div class="label">${esc(b.title)}</div>
    ${timeUp?'<div class="banner">Time is up. Your test was submitted automatically.</div>':""}
    <div class="score"><span class="big num">${pct}%</span><span><b class="num">${right}</b> of <b class="num">${n}</b> correct</span></div>
    <div class="muted" id="sendst">${sendText(st)}</div>
    <div class="nav"><button class="btn" id="back">All quizzes</button>${b.kind==="quiz"?`<button class="btn primary" id="again">Try again</button>`:""}</div>
    <h2>Corrections</h2>
    ${b.items.map((it,k)=>{const ok=R.ans[k]===it.a;return `<div class="rev"><div class="qhead"><b>Question ${k+1}</b><span class="chip ${ok?"good":"bad"}">${ok?"Correct":R.ans[k]==null?"No answer":"Incorrect"}</span></div>
      <div class="stem">${it.q}</div>${it.img.map(src=>`<div class="fig"><img src="quiz-img/${src}" alt="Graph for question ${k+1}" loading="lazy"></div>`).join("")}
      <div class="muted">Your answer: <b>${R.ans[k]==null?"none":"("+"ABCD"[R.ans[k]]+")"}</b> · Correct answer: <b>(${"ABCD"[it.a]})</b> ${it.c[it.a]}</div>
      <div class="exp ${ok?"":"no"}">${it.e}</div></div>`}).join("")}
  </div>`;
  math($("#main"));window.scrollTo({top:0});
  try{history.replaceState(null,"","#")}catch(e){}
}

/* ---------- events ---------- */
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="si"){const n=$("#nm").value.trim().replace(/\s+/g," "),c=$("#cc").value.trim().toUpperCase();if(n)doSignin(n,c)}});
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.id==="signout"){S.me=null;LS.set("me",null);return signin()}
  if(t.dataset.course){S.course=t.dataset.course;LS.set("course",S.course);return home()}
  if(t.dataset.open)return start(t.dataset.open);
  const R=S.run;if(!R)return;
  if(t.dataset.pick!=null){if(R.b.kind==="quiz"&&R.lock[R.i])return;R.ans[R.i]=+t.dataset.pick;save();return view()}
  if(t.id==="check"){R.lock[R.i]=true;return view()}
  if(t.id==="next"){if(R.b.kind==="quiz"&&R.i===R.b.items.length-1)return finish(false);R.i++;R.confirm=false;save();return view()}
  if(t.id==="prev"){R.i--;R.confirm=false;return view()}
  if(t.dataset.go!=null){R.i=+t.dataset.go;save();return view()}
  if(t.id==="ask"){R.confirm=true;return view()}
  if(t.id==="cancel"){R.confirm=false;return view()}
  if(t.id==="finish")return finish(false);
  if(t.id==="quit"){clearInterval(tick);if(R.b.kind==="test"){save()}S.run=null;try{history.replaceState(null,"","#")}catch(e){};return home()}
  if(t.id==="again")return start(R.b.id);
  if(t.id==="back"){S.run=null;return home()}
});
window.addEventListener("online",flush);
window.addEventListener("hashchange",()=>{const id=decodeURIComponent(location.hash.slice(1));if(S.me&&id&&(!S.run||S.run.id!==id)&&BANK.some(b=>b.id===id)){const b=BANK.find(x=>x.id===id);S.course=b.course;start(id)}});

/* ---------- boot ---------- */
(function(){
  if(!S.me)return signin();
  flush();
  const h=decodeURIComponent(location.hash.slice(1));
  if(h&&BANK.some(b=>b.id===h)){const b=BANK.find(x=>x.id===h);S.course=b.course;return start(h)}
  const saved=LS.get("run",null);
  if(saved&&Date.now()<saved.end&&BANK.some(b=>b.id===saved.id))return start(saved.id);
  home();
})();
</script>
