<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Teacher dashboard to track unit progress, scores and exam review for AP Precalculus, AP Calculus AB and SAT Math.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}.rep{background:#fff;color:#16223A;border:1px solid var(--line);border-radius:10px;padding:22px;display:grid;gap:14px;max-width:760px;margin:0 auto;font-size:15px}
.rep h2{color:#16223A}.rep .rmuted{color:#5B6880}
.rep-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;border-bottom:3px solid #2A55D9;padding-bottom:10px}
.rep-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.rep-kpis div{border:1px solid #CDD6E2;border-radius:8px;padding:10px}
.rep-kpis b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1.1}
.rep-bars{display:grid;gap:7px}
.rep-bar{display:grid;grid-template-columns:2.6em 1fr 8em;gap:10px;align-items:center;font-size:.9rem}
.rep-bar i{display:block;height:9px;border-radius:5px;background:#E3E8EF;position:relative;overflow:hidden}
.rep-bar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:#2A55D9;border-radius:5px}
.rep table{width:100%;border-collapse:collapse;font-size:.9rem}.rep td,.rep th{padding:5px 6px;border-bottom:1px solid #E3E8EF;text-align:left}.rep .r{text-align:right}
.rep textarea{font:inherit;width:100%;min-height:80px;border:1px solid #CDD6E2;border-radius:8px;padding:8px;color:#16223A;background:#fff}
.rep .comment{border-left:4px solid #F4C430;padding:4px 10px;font-style:italic;white-space:pre-wrap}
.rep-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:end;max-width:760px;margin:0 auto 12px}
@media print{body{background:#fff!important}header.top,#banner,nav.tabs,.rep-tools,.toast,.no-print{display:none!important}.wrap{padding:0!important;max-width:none}.rep{border:0;padding:0;max-width:none}.rep textarea{display:none}.rep .comment.print-only{display:block!important}}
.print-only{display:none}
</style>
<title>AP Math Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: graph-paper notebook — course switch on top, three views (Class / Student / Plan), single column on phones */
:root{
  --bg:#EEF2F6; --paper:#FFFFFF; --grid:#DCE4EE; --ink:#16223A; --muted:#5B6880; --line:#CDD6E2;
  --accent:#2A55D9; --accent-ink:#FFFFFF; --hl:#F4C430;
  --m0:#E3E8EF; --m1:#F2B84B; --m2:#4FA3A5; --m3:#1F6F4A;
  --bad:#C2412D; --good:#1F6F4A;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --paper:#171F30; --grid:#1D2738; --ink:#E6ECF5; --muted:#93A0B8; --line:#2A3650;
  --accent:#7D9BFF; --accent-ink:#0F1522; --hl:#E8B92E;
  --m0:#26314A; --m1:#C9963A; --m2:#3E8E90; --m3:#3FA36E; --bad:#F07560; --good:#5CC48E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1522; --paper:#171F30; --grid:#1D2738; --ink:#E6ECF5; --muted:#93A0B8; --line:#2A3650;
  --accent:#7D9BFF; --accent-ink:#0F1522; --hl:#E8B92E;
  --m0:#26314A; --m1:#C9963A; --m2:#3E8E90; --m3:#3FA36E; --bad:#F07560; --good:#5CC48E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.7rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:500}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.course{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.course button{border:0;background:none;color:var(--ink);font:inherit;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer}
.course button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line)}
nav.tabs button{white-space:nowrap;border:0;background:none;font:inherit;color:var(--muted);font-weight:700;padding:8px 12px;margin-bottom:-2px;border-bottom:2px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,.cell:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.banner{background:var(--hl);color:#16223A;border-radius:8px;padding:8px 12px;font-size:.9rem}
.count{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.count .big{font-family:var(--f-display);font-weight:700;font-size:2.6rem;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
form.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
form.row label{display:grid;gap:2px;font-size:.8rem;color:var(--muted);flex:1 1 120px;min-width:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
.scroll{overflow-x:auto}
textarea.f{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-height:70px}
.cform{display:grid;gap:10px}.cform label{display:grid;gap:2px;font-size:.8rem;color:var(--muted)}
.cform .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arow{display:grid;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.arow.sel{border:2px solid var(--accent)}
.crow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);text-align:left;font:inherit;color:var(--ink);cursor:pointer;width:100%}
.crow small{grid-column:1/-1;color:var(--muted)}
.pgimg{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;display:block;transition:transform .2s}
.pgwrap{display:grid;gap:6px}
.gradebar{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--line);padding:12px 0 4px;display:grid;gap:8px}
.gradebar .g{display:flex;gap:8px;align-items:center}.gradebar .g input{max-width:110px;font-size:1.3rem;font-weight:700;text-align:center}
.aibox{border:2px solid #7A5AF8;border-radius:10px;padding:12px;display:grid;gap:8px;background:color-mix(in srgb,#7A5AF8 6%,var(--paper))}
.aibox table{border-collapse:collapse;width:100%;font-size:.88rem}.aibox td{border-top:1px solid var(--line);padding:5px 4px;vertical-align:top}
.aibox td.n{white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.btn.ai{background:#7A5AF8;border-color:#7A5AF8;color:#fff}
.chip.todo{background:var(--hl);color:#16223A;border-color:var(--hl)}
table.heat{border-collapse:separate;border-spacing:3px;font-size:.85rem}
table.heat th{font-weight:700;color:var(--muted);text-align:center;font-family:var(--f-mono);font-size:.78rem}
table.heat th.name,table.heat td.name{text-align:left;white-space:nowrap;padding-right:8px;max-width:140px;overflow:hidden;text-overflow:ellipsis}
table.heat td.name button{all:unset;cursor:pointer;color:var(--ink);font-weight:700}
table.heat td.name button:focus-visible{outline:3px solid var(--hl)}
.cell{width:30px;height:26px;border-radius:4px;display:block}
.l0{background:var(--m0)}.l1{background:var(--m1)}.l2{background:var(--m2)}.l3{background:var(--m3)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.students{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.srow .bar{grid-column:1/-1;display:flex;gap:2px}
.srow .bar i{flex:1;height:6px;border-radius:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip.ap{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.warn{color:var(--bad);border-color:var(--bad)}
.units{display:grid;gap:8px}
.unit{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.unit .u{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.unit .t{min-width:0}
.unit .t small{display:block;color:var(--muted);font-size:.78rem}
.lv{display:flex;gap:3px}
.lv button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font:inherit;font-size:.75rem;font-weight:700;color:var(--muted)}
.lv button[aria-pressed="true"].b1{background:var(--m1);color:#16223A;border-color:var(--m1)}
.lv button[aria-pressed="true"].b2{background:var(--m2);color:#fff;border-color:var(--m2)}
.lv button[aria-pressed="true"].b3{background:var(--m3);color:#fff;border-color:var(--m3)}
.lv button[aria-pressed="true"].b0{background:var(--m0);color:var(--ink)}
table.scores{width:100%;border-collapse:collapse;font-size:.88rem}
table.scores th,table.scores td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
table.scores td.r,table.scores th.r{text-align:right}
.week{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}
.week:last-child{border-bottom:0}
.week input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.week.done .wt{text-decoration:line-through;color:var(--muted)}
.week .tag{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:4px;margin-left:6px}
.tag.rev{background:var(--hl);color:#16223A}
.tag.exam{background:var(--bad);color:#fff}
.tag.now{background:var(--accent);color:var(--accent-ink)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--bad);border-radius:8px;padding:8px 10px}
.empty{padding:18px;border:2px dashed var(--line);border-radius:10px;text-align:center;color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:700;font-size:.9rem;z-index:20}
details.unitlib{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
details.unitlib summary{cursor:pointer;padding:10px 12px;display:flex;gap:10px;align-items:baseline;justify-content:space-between;font-weight:700;list-style:none}
details.unitlib summary::-webkit-details-marker{display:none}
details.unitlib summary::before{content:"+";font-family:var(--f-mono);color:var(--accent);margin-right:2px}
details.unitlib[open] summary::before{content:"−"}
details.unitlib summary .st{flex:1;min-width:0}
.lesson{display:grid;grid-template-columns:3.2em 1fr;gap:4px 10px;padding:9px 12px;border-top:1px solid var(--line)}
.lesson .ln{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:2px}
.lesson .lt{min-width:0}
.unitfiles{display:flex;flex-wrap:wrap;gap:8px;padding:4px 12px 12px}
.lessons-h{padding:8px 12px 2px;border-top:1px solid var(--line)}
.lesson{border-top:0!important;padding-block:6px!important}
.res{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.wspair{display:inline-flex}.wspair .rbtn:first-child{border-radius:6px 0 0 6px}.wspair .rbtn.key{border-radius:0 6px 6px 0;border-left:0;padding-inline:6px}.wspair .rbtn.key:not(:last-child){border-radius:0}
.lesson.review{background:color-mix(in srgb,var(--hl) 12%,transparent)}
.rbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.82rem;font-weight:700;padding:4px 10px;border-radius:6px;cursor:pointer;text-decoration:none}
.rbtn .k{font-size:.66rem;letter-spacing:.06em;padding:1px 5px;border-radius:3px;background:var(--m0);color:var(--ink)}
.rbtn.key .k{background:var(--m1);color:#16223A}
.rbtn.quiz .k{background:var(--good);color:#fff}.wspair a.rbtn.quiz{border-radius:0 6px 6px 0;border-left:0;padding-inline:6px}
.reader{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.reader .bar{display:flex;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--paper);border-bottom:1px solid var(--line)}
.reader .bar .rt{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader .scrollr{flex:1;overflow:auto;padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.reader .pages{display:grid;justify-items:center;gap:12px}
.reader .pg{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);max-width:100%}
.reader .pg canvas{width:100%;height:100%;display:block}
.reader .msg{max-width:480px;margin:40px auto;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.srow,.btn,.lv button{transition:background .15s,border-color .15s}}
@media (max-width:480px){h1{font-size:1.4rem}.count .big{font-size:2.1rem}.unit{grid-template-columns:1fr;}.unit .u{display:none}}

@media (max-width:640px){
  body{font-size:16px}
  .wrap{gap:14px;padding-block:12px 64px}
  nav.tabs{position:sticky;top:0;z-index:6;background:var(--bg);margin-inline:-16px;padding-inline:8px}
  nav.tabs button{flex:1;padding:13px 4px;font-size:.98rem}
  .course{display:grid;grid-template-columns:repeat(2,1fr);width:100%;border-radius:16px}
  .course button{padding:11px 4px;white-space:nowrap}
  .panel{padding:14px}
  details.unitlib summary{padding:14px 12px;font-size:1rem}
  .lesson{grid-template-columns:auto 1fr;gap:8px 10px;padding:12px!important;align-items:baseline}
  .lesson .lt{font-weight:700;line-height:1.3}
  .lesson .ln{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
  .res{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .res>.rbtn.quiz{grid-column:1/-1}
  .rbtn{min-height:44px;justify-content:center;font-size:.92rem;padding:8px 10px;border-radius:9px}
  .wspair{grid-column:1/-1;display:grid;grid-template-columns:1fr auto auto}
  .wspair .rbtn.key,.wspair a.rbtn.quiz{padding-inline:12px}
  .unitfiles{display:grid;grid-template-columns:1fr;gap:8px}
  .unitfiles .rbtn{justify-content:flex-start}
  .btn{min-height:44px}
  .srow{padding:13px 12px}
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div>
      <div class="label">Teacher dashboard · 2026–2027</div>
      <h1>AP Math Tracker</h1>
    </div>
    <div class="course" role="group" aria-label="Course">
      <button id="c-pc" data-course="pc">Precalculus</button>
      <button id="c-ab" data-course="ab">Calculus AB</button>
      <button id="c-p1" data-course="p1">Physics 1</button>
      <button id="c-sat" data-course="sat">SAT Math</button>
    </div>
  </header>
  <div id="banner"></div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="t-class" data-view="class">Class</button>
    <button role="tab" id="t-student" data-view="student">Student</button>
    <button role="tab" id="t-plan" data-view="plan">Review plan</button>
    <button role="tab" id="t-courses" data-view="courses">Courses</button>
    <button role="tab" id="t-copies" data-view="copies">Copies</button>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="reader" id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="rTitle">
  <div class="bar">
    <button class="btn sm" id="rClose" aria-label="Close the document">← Back</button>
    <span class="rt" id="rTitle"></span>
    <span class="muted num" id="rPages" style="font-size:.8rem"></span>
    <button class="btn sm" id="zOut" aria-label="Zoom out">−</button>
    <button class="btn sm" id="zIn" aria-label="Zoom in">+</button>
    <a class="btn sm" id="rOpen" href="#" target="_blank" rel="noopener">Open</a>
  </div>
  <div class="scrollr" id="rScroll"><div class="pages" id="rWrap"></div></div>
</div>
<script src="../vendor/pdfjs/pdf.js"></script>
<script src="courses.js?v=10"></script>
<script src="quiz-config.js?v=12"></script>
<script src="quiz-bank.js?v=8"></script>

<script>
const COURSES={
  pc:{name:"AP Precalculus",exam:new Date(2027,4,11,8,0),examLabel:"Tuesday, May 11, 2027, morning",
    cut:[65,52,40,28],
    units:[
      {id:"u1",n:"1",t:"Polynomial and Rational Functions",w:[30,40]},
      {id:"u2",n:"2",t:"Exponential and Logarithmic Functions",w:[27,40]},
      {id:"u3",n:"3",t:"Trigonometric and Polar Functions",w:[30,35]},
      {id:"u4",n:"4",t:"Functions Involving Parameters, Vectors, and Matrices",w:null}]},
  ab:{name:"AP Calculus AB",exam:new Date(2027,4,10,8,0),examLabel:"Monday, May 10, 2027, morning",
    cut:[63,50,38,25],
    units:[
      {id:"u1",n:"1",t:"Limits and Continuity",w:[10,12]},
      {id:"u2",n:"2",t:"Differentiation: Definition and Fundamental Properties",w:[10,12]},
      {id:"u3",n:"3",t:"Differentiation: Composite, Implicit, and Inverse Functions",w:[9,13]},
      {id:"u4",n:"4",t:"Contextual Applications of Differentiation",w:[10,15]},
      {id:"u5",n:"5",t:"Analytical Applications of Differentiation",w:[15,18]},
      {id:"u6",n:"6",t:"Integration and Accumulation of Change",w:[17,20]},
      {id:"u7",n:"7",t:"Differential Equations",w:[6,12]},
      {id:"u8",n:"8",t:"Applications of Integration",w:[10,15]}]},
  /* AP Physics 1: unit weights from the Course and Exam Description; cutoffs are rough estimates */
  p1:{name:"AP Physics 1",exam:new Date(2027,4,5,12,0),examLabel:"Wednesday, May 5, 2027, afternoon",
    format:"42 multiple-choice questions (85 min) in Bluebook, then 4 free-response questions (95 min); calculator and equation sheet allowed",
    cut:[70,55,40,28],
    units:[
      {id:"u1",n:"1",t:"Kinematics",w:[10,15]},
      {id:"u2",n:"2",t:"Force and Translational Dynamics",w:[18,23]},
      {id:"u3",n:"3",t:"Work, Energy, and Power",w:[18,23]},
      {id:"u4",n:"4",t:"Linear Momentum",w:[10,15]},
      {id:"u5",n:"5",t:"Torque and Rotational Dynamics",w:[10,15]},
      {id:"u6",n:"6",t:"Energy and Momentum of Rotating Systems",w:[5,8]},

  /* SAT Math: units are the four domains, weighted by their share of the 44 questions; target date can be changed here */
  sat:{name:"SAT Math",sat:true,exam:new Date(2027,2,6,8,0),examLabel:"Saturday, March 6, 2027 (other dates: December 5, 2026; May 1 and June 5, 2027)",
    format:"Digital SAT in Bluebook: two adaptive modules of 22 questions, calculator allowed",
    units:[
      {id:"d1",n:"1",t:"Algebra",w:[30,34]},

      {id:"d3",n:"3",t:"Problem-Solving and Data Analysis",w:[11,16]},
      {id:"d4",n:"4",t:"Geometry and Trigonometry",w:[11,16]}]}
};
const SHORT={pc:"Precalc",ab:"Calc AB",p1:"Physics 1",sat:"SAT"};
const UL=c=>COURSES[c].sat?"Domain ":"Unit ",UA=c=>COURSES[c].sat?"D":"U";
const LV=["Not started","In progress","Proficient","Mastered"];
const state={course:"pc",view:"class",sel:null,students:[],plans:{pc:{},ab:{},p1:{},sat:{}},db:null,mode:"loading",confirmDel:false,writable:true};
try{const s=JSON.parse(localStorage.getItem("apMathTracker.prefs")||"{}");if(s.course)state.course=s.course;if(s.view)state.view=s.view}catch(e){}
function savePref(){try{localStorage.setItem("apMathTracker.prefs",JSON.stringify({course:state.course,view:state.view}))}catch(e){}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(d,o)=>d.toLocaleDateString("en-US",o||{day:"numeric",month:"short"});
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,1800)}

/* ---------- calculations ---------- */
function testedUnits(c){return COURSES[c].units.filter(u=>u.w)}
function pct(s){return s.max>0?Math.round(100*s.pts/s.max):0}
function apEstimate(c,p){if(COURSES[c].sat)return Math.round((200+6*p)/10)*10;const k=COURSES[c].cut;return p>=k[0]?5:p>=k[1]?4:p>=k[2]?3:p>=k[3]?2:1}
const estOf=c=>COURSES[c].sat?"/800":"/5";
function lastScores(st,n){return [...(st.scores||[])].sort((a,b)=>a.d<b.d?-1:1).slice(-n)}
function studentAvgPct(st){const l=lastScores(st,3);return l.length?Math.round(l.reduce((a,s)=>a+pct(s),0)/l.length):null}
function mastery(st,uid){return (st.progress||{})[uid]||0}
function classUnitAvg(list,uid){return list.length?list.reduce((a,s)=>a+mastery(s,uid),0)/list.length:0}
function daysUntil(d){const t=new Date();t.setHours(0,0,0,0);const e=new Date(d);e.setHours(0,0,0,0);return Math.round((e-t)/864e5)}
function monday(d){const x=new Date(d);x.setHours(0,0,0,0);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function courseStudents(){return state.students.filter(s=>s.course===state.course).sort((a,b)=>a.name.localeCompare(b.name,"en"))}

function buildPlan(c){
  const C=COURSES[c],list=state.students.filter(s=>s.course===c);
  const start=monday(new Date()),examMon=monday(C.exam);
  const total=Math.max(1,Math.round((examMon-start)/(7*864e5)));
  const REV=Math.min(5,Math.max(1,Math.floor(total/4)));
  const teachN=Math.max(0,total-REV);
  const tested=testedUnits(c);
  const todo=tested.filter(u=>!list.length||classUnitAvg(list,u.id)<2);
  const weeks=[];
  // split weeks by exam weighting (largest remainder, at least 1 week each)
  let alloc=[];
  if(todo.length&&teachN>0){
    const w=todo.map(u=>(u.w[0]+u.w[1])/2),sw=w.reduce((a,b)=>a+b,0);
    if(teachN>=todo.length){
      const raw=w.map(x=>x/sw*teachN);alloc=raw.map(r=>Math.max(1,Math.floor(r)));
      let rest=teachN-alloc.reduce((a,b)=>a+b,0);
      const order=raw.map((r,i)=>[r-Math.floor(r),i]).sort((a,b)=>b[0]-a[0]);
      let k=0;while(rest>0){alloc[order[k%order.length][1]]++;rest--;k++}
      while(rest<0){const i=alloc.indexOf(Math.max(...alloc));alloc[i]--;rest++}
    } else alloc=todo.map((u,i)=>i<teachN?1:0);
  }
  let d=new Date(start);
  todo.forEach((u,i)=>{for(let j=0;j<(alloc[i]||0);j++){weeks.push({d:new Date(d),kind:"teach",title:UL(c)+u.n+" · "+u.t,sub:alloc[i]>1?"Week "+(j+1)+" of "+alloc[i]:"One week",uid:u.id});d.setDate(d.getDate()+7)}});
  // review: weakest units first
  const weak=[...tested].sort((a,b)=>classUnitAvg(list,a.id)-classUnitAvg(list,b.id));
  const revItems=[];
  for(let i=0;i<REV;i++){
    if(i===REV-1&&REV>=2) revItems.push(C.sat?{title:"Full practice test",sub:"Real conditions in Bluebook: two adaptive modules, 70 minutes"}:{title:"Full practice exam",sub:"Real conditions: multiple choice in Bluebook, then free response on paper"});
    else if(i===REV-2&&REV>=3) revItems.push(C.sat?{title:"Timed mixed practice",sub:"Questions from every domain, 1 min 35 s per question, Desmos on every question"}:{title:"Past free-response questions (FRQs)",sub:"Grade with the official College Board scoring guidelines"});
    else {const u=weak[i%weak.length];revItems.push({title:"Review · "+UL(c)+u.n+" · "+u.t,sub:"One of the class's weakest units (average: "+LV[Math.round(classUnitAvg(list,u.id))].toLowerCase()+")",uid:u.id})}
  }
  revItems.forEach(r=>{weeks.push({d:new Date(d),kind:"rev",...r});d.setDate(d.getDate()+7)});
  weeks.push({d:examMon,kind:"exam",title:"Exam week",sub:C.examLabel});
  const done=todo.length?null:"The class is proficient in every tested unit, so the plan goes straight to review.";
  return {weeks,done,REV,teachN};
}

function render(){
  document.querySelectorAll(".course button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.course===state.course));
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===state.view));
  $("#banner").innerHTML=state.mode==="demo"?'<div class="banner"><b>Demo mode.</b> Storage is not available in this view: the students shown are examples and your changes will not be saved.</div>':
    (!state.writable?'<div class="banner">Read only: you can view the tracker but not edit it.</div>':"");
  const m=$("#main");
  if(state.mode==="loading"){m.innerHTML='<div class="panel"><p class="muted">Loading tracker…</p></div>';return}
  m.innerHTML=state.report?viewReport():state.view==="class"?viewClass():state.view==="student"?viewStudent():state.view==="courses"?viewCourses():state.view==="copies"?viewCopies():viewPlan();
  if(state.view==="student")drawChart();
}

    <div class="muted">${esc(C.examLabel)} · ${esc(C.format||"Multiple choice in Bluebook, free response on paper")}.</div>
  </div>`;
}

function drawChart(){
  const el=$("#chart");if(!el)return;
  const s=state.students.find(x=>x.id===state.sel);if(!s)return;
  const pts=[...(s.scores||[])].sort((a,b)=>a.d<b.d?-1:1);
  if(pts.length<2){el.innerHTML=pts.length?'<p class="muted" style="margin:0;font-size:.85rem">The chart appears once there are two scores.</p>':"";return}
  const W=340,H=150,L=30,R=10,T=10,B=22,iw=W-L-R,ih=H-T-B;
  const x=i=>L+(pts.length===1?iw/2:i*iw/(pts.length-1)),y=v=>T+ih-(v/100)*ih;
  const cut=COURSES[state.course].cut;
  let g="";[0,50,100].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`);
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(cut[2])}" y2="${y(cut[2])}" stroke="var(--hl)" stroke-dasharray="4 3" stroke-width="1.5"/><text x="${W-R}" y="${y(cut[2])-4}" text-anchor="end">AP 3 cutoff</text>`;
  const line=pts.map((p,i)=>`${x(i)},${y(pct(p))}`).join(" ");
  const area=`${x(0)},${y(0)} ${line} ${x(pts.length-1)},${y(0)}`;
  const lastI=pts.length-1;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Scores over time, in percent">${g}
    <polygon points="${area}" fill="var(--accent)" opacity=".12"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(pct(p))}" r="${i===lastI?4.5:2.5}" fill="${i===lastI?"var(--accent)":"var(--paper)"}" stroke="var(--accent)" stroke-width="1.5"><title>${esc(p.label)}: ${pct(p)}%</title></circle>`).join("")}
    <text x="${x(0)}" y="${H-6}" text-anchor="start">${fmt(new Date(pts[0].d+"T12:00"))}</text>
    <text x="${x(lastI)}" y="${H-6}" text-anchor="end">${fmt(new Date(pts[lastI].d+"T12:00"))}</text></svg>`;
}

function viewPlan(){
  const C=COURSES[state.course],P=buildPlan(state.course),done=state.plans[state.course]||{};

  return `<div style="display:grid;gap:18px">${countdown()}

function pdfUrl(c,f){return "docs/"+c+"/"+f+".pdf"}
function planLesson(u,l){
  const c=state.course,base=u.plan+l.n,lab=l.review?l.t:(c==="sat"?"Skill ":"Topic ")+l.n;
  if(!u.free&&!l.free){   // encrypted files: the teacher opens them on the student site with the teacher key
    const qid=c+"-"+base;
    return `<div class="lesson"><span class="ln">${esc(l.n)}</span><span class="lt">${esc(l.t)}</span><div class="res"><a class="rbtn" href="learn.html#courses" target="_blank" rel="noopener">Open on the student site 🔒</a>${(window.QUIZ_LOCKED||[]).some(q=>q.id===qid)?`<a class="rbtn quiz" href="learn.html#${esc(qid)}" target="_blank" rel="noopener"><span class="k">ONLINE</span>Quiz 🔒</a>`:""}</div></div>`;
  }
  const notes=l.notes?`<button class="rbtn" data-pdf="${esc(pdfUrl(c,base+"-notes"))}" data-title="${esc(lab+" · Guided notes")}">Notes</button><button class="rbtn" data-pdf="${esc(pdfUrl(c,base+"-notes-filled"))}" data-title="${esc(lab+" · Notes (filled in)")}">Filled notes</button>`:"";

const pdfLib=window.pdfjsLib;
if(pdfLib)pdfLib.GlobalWorkerOptions.workerSrc="../vendor/pdfjs/pdf.worker.js";
let pdoc=null,zoom=1,pobs=null,ptoken=0,lastFocus=null;
function baseWidth(){return Math.min(900,$("#rScroll").clientWidth-24)*zoom}
async function openPdf(url,title){
  lastFocus=document.activeElement;
  $("#rTitle").textContent=title;$("#rOpen").href=url;$("#rPages").textContent="";
  const wrap=$("#rWrap");wrap.innerHTML='<div class="msg">Loading document…</div>';
  $("#reader").hidden=false;document.body.style.overflow="hidden";$("#rClose").focus();
  zoom=1;const my=++ptoken;
  let data;
  try{const res=await fetch(url);if(!res.ok)throw new Error("http "+res.status);data=await res.arrayBuffer()}
  catch(err){if(my===ptoken)wrap.innerHTML='<div class="msg">This document could not be loaded. Check your connection and try again.</div>';return}
  if(my!==ptoken)return;
  if(!pdfLib){wrap.innerHTML='<div class="msg">The built-in reader could not start in this browser. Use Open to view the PDF.</div>';return}
  try{pdoc=await pdfLib.getDocument({data:new Uint8Array(data)}).promise;if(my!==ptoken)return;$("#rPages").textContent=pdoc.numPages+" p.";layoutPdf()}
  catch(err){wrap.innerHTML='<div class="msg">The built-in reader could not display this document. Use Open to view the PDF.</div>'}
}
async function layoutPdf(){
  if(pobs)pobs.disconnect();const wrap=$("#rWrap");wrap.innerHTML="";
  const first=await pdoc.getPage(1),vp=first.getViewport({scale:1}),w=baseWidth(),h=w*vp.height/vp.width;
  for(let i=1;i<=pdoc.numPages;i++){const d=document.createElement("div");d.className="pg";d.style.width=w+"px";d.style.height=h+"px";d.dataset.p=i;wrap.appendChild(d)}
  pobs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target.dataset.done){e.target.dataset.done=1;drawPdfPage(e.target)}}),{root:$("#rScroll"),rootMargin:"600px 0px"});
  wrap.querySelectorAll(".pg").forEach(d=>pobs.observe(d));
}
async function drawPdfPage(div){
  if(!pdoc)return;const page=await pdoc.getPage(+div.dataset.p);
  const w=parseFloat(div.style.width),vp0=page.getViewport({scale:1}),dpr=Math.min(window.devicePixelRatio||1,2.5);
  const vp=page.getViewport({scale:w/vp0.width*dpr});const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;
  div.style.height=(w*vp0.height/vp0.width)+"px";div.appendChild(cv);
  await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
}
function closeReader(){$("#reader").hidden=true;document.body.style.overflow="";ptoken++;if(pobs)pobs.disconnect();$("#rWrap").innerHTML="";if(pdoc){pdoc.destroy();pdoc=null}if(lastFocus&&lastFocus.focus)lastFocus.focus()}
$("#rClose").addEventListener("click",closeReader);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#reader").hidden)closeReader()});
$("#zIn").addEventListener("click",()=>{if(pdoc){zoom=Math.min(2.5,zoom*1.25);layoutPdf()}});
$("#zOut").addEventListener("click",()=>{if(pdoc){zoom=Math.max(.5,zoom/1.25);layoutPdf()}});

const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const LVFR=["Pas commencé","En cours","Acquis","Maîtrisé"];
const monthKey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const monthName=k=>{const [y,m]=k.split("-");return MOIS[+m-1]+" "+y};
function prevMonth(k){const [y,m]=k.split("-").map(Number);return monthKey(new Date(y,m-2,1))}
function reportData(s,k){
  const C=COURSES[s.course],sc=(s.scores||[]).filter(x=>String(x.d).startsWith(k)).sort((a,b)=>a.d<b.d?-1:1);
  const pv=(s.scores||[]).filter(x=>String(x.d).startsWith(prevMonth(k)));
  const avg=a=>a.length?Math.round(a.reduce((t,x)=>t+pct(x),0)/a.length):null;
  const a=avg(sc),b=avg(pv);
  const units=C.units.filter(u=>u.w).map(u=>({u,l:mastery(s,u.id)}));
  const UF=C.sat?"Domaine ":"Unité ";
  const strong=units.filter(x=>x.l>=2).map(x=>UF+x.u.n+" ("+x.u.t+")");
  const work=[...units.filter(x=>x.l===1).map(x=>UF+x.u.n+" ("+x.u.t+")"),...sc.filter(x=>pct(x)<60).map(x=>x.label.replace(/^(Quiz|Test): /,""))];
  const p=studentAvgPct(s);
  return {C,sc,a,b,units,strong,work:[...new Set(work)].slice(0,4),ap:p==null?null:apEstimate(s.course,p)};
}

/* ---------- online quiz results ---------- */
function quizLink(){try{return new URL("learn.html",location.href).href}catch(e){return "learn.html"}}
function teacherKey(){try{return localStorage.getItem("apMathTracker.qkey")||""}catch(e){return ""}}
const normName=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
async function importResults(k){
  const ep=(window.QUIZ_CONFIG||{}).endpoint;if(!ep)return;
  try{localStorage.setItem("apMathTracker.qkey",k)}catch(e){}
  const b=document.getElementById("qbtn");if(b){b.disabled=true;b.textContent="Importing…"}
  let R=null;
  try{const r=await fetch(ep,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"results",key:k})});R=await r.json()}catch(e){}
  if(!R||!R.ok){render();toast(R&&R.error==="key"?"The teacher key is not correct":"Could not reach the Google Sheet. Try again.");return}
  const done=new Set(state.imported||[]);let added=0,created=0;
  for(const x of R.results){
    if(!x.id||done.has(x.id)||!COURSES[x.course])continue;
    let s=state.students.find(st=>st.course===x.course&&normName(st.name)===normName(x.name));
    if(!s){s={id:newId(),name:String(x.name).trim(),course:x.course,progress:{},scores:[],createdAt:new Date().toISOString()};state.students.push(s);created++}
    s.scores=[...(s.scores||[]),{k:"q-"+x.id,label:(x.kind==="test"||x.kind==="sat"?"Test: ":"Quiz: ")+x.title,unit:null,pts:Number(x.score)||0,max:Number(x.total)||1,d:String(x.time).slice(0,10)}];
    done.add(x.id);added++;
  }
  state.imported=[...done];persist();render();
  toast(added?`${added} result${added>1?"s":""} imported${created?`, ${created} new student${created>1?"s":""}`:""}`:"No new results");
}
const STORE="apMathTracker.v1";
function persist(){
  if(state.mode!=="local")return;
  try{localStorage.setItem(STORE,JSON.stringify({v:1,students:state.students,plans:state.plans,imported:state.imported||[]}))}
  catch(e){toast("Could not save in this browser")}
}
function loadData(obj){
  if(!obj||!Array.isArray(obj.students))throw new Error("bad");
  state.students=obj.students.filter(s=>s&&s.id&&s.name&&COURSES[s.course]).map(s=>({progress:{},scores:[],...s}));
  state.plans={pc:{},ab:{},p1:{},sat:{},...(obj.plans||{})};
  state.imported=Array.isArray(obj.imported)?obj.imported:[];
}
function exportData(){

  let f=$("#caF").value;if(f==="code"){f=$("#caC").value.trim().toUpperCase();if(!f){toast("Enter the class code");return}}
  const file=$("#caP").files[0];let pdf="";
  if(file){if(file.size>10*1048576){toast("The PDF is larger than 10 MB");return}
    pdf=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(file)})}
  const b=$("#caGo");b.disabled=true;b.textContent="Creating…";
  const kf=$("#caKP").files[0];if(kf&&kf.size>10*1048576){b.disabled=false;b.textContent="Create the assignment";toast("The answer key PDF is larger than 10 MB");return}
  const keyPdf=kf?await readPdf(kf):"";
  let R=null;try{R=await cpPost({action:"assign",title:t,forStr:f,due:$("#caD").value,outOf:+$("#caO").value||20,instructions:$("#caI").value,pdf,pdfName:file?file.name:"",answerKey:$("#caK").value,keyPdf,keyPdfName:kf?kf.name:""})}catch(e){}
  if(!R||!R.ok){b.disabled=false;b.textContent="Create the assignment";toast("Not created: check your connection");return}
  CP.form=false;CP.asg=R.id;toast("Assignment created: students see it in their Copies tab");cpLoad();
}
document.addEventListener("click",e=>{
  if(state.view!=="copies")return;const t=e.target.closest("button");if(!t)return;
  if(t.id==="cpReload"){CP.data=null;CP.err="";render();return}
  if(t.id==="cpNew"){CP.form=true;render();return}
  if(t.id==="cpNoNew"){CP.form=false;render();return}
  if(t.id==="cpAll"){CP.asg=null;render();return}
  if(t.id==="cpBack"){CP.sel=null;render();return}
  if(t.id==="aiSet"){CP.aiSetup=true;render();return}
  if(t.id==="aiNo"){CP.aiSetup=false;render();return}
  if(t.id==="aiDel"){cpPost({action:"setai",apiKey:""}).then(R=>{if(R&&R.ok){CP.data.aiReady=false;CP.aiSetup=false;render();toast("API key removed")}});return}
  if(t.id==="aiGo"){aiGrade();return}
  if(t.id==="aiUse"){const c=CP.data.copies.find(x=>x.id===CP.sel);let p=null;try{p=JSON.parse(c.ai)}catch(x){}if(!p)return;
    $("#cgN").value=String(p.total).replace(".",",");$("#cgC").value=p.comment||"";$("#cgN").scrollIntoView({block:"center"});toast("Proposal copied: check it, then Save");return}
  if(t.dataset.cpkey){CP.keyEdit=CP.keyEdit===t.dataset.cpkey?null:t.dataset.cpkey;render();return}
  if(t.id==="ckNo"){CP.keyEdit=null;render();return}
  if(t.dataset.cpasg){CP.asg=CP.asg===t.dataset.cpasg?null:t.dataset.cpasg;render();return}
  if(t.dataset.cpsel){CP.sel=t.dataset.cpsel;render();window.scrollTo({top:0});return}
  if(t.dataset.cprot!=null){const k=CP.sel+":"+t.dataset.cprot;CP.rot[k]=((CP.rot[k]||0)+90)%360;const im=t.closest(".pgwrap").querySelector("img");if(im)im.style.transform=`rotate(${CP.rot[k]}deg)`;return}
  if(t.dataset.cpopen){const a=CP.data.assignments.find(x=>x.id===t.dataset.cpopen),v=t.dataset.v==="1";
    cpPost({action:"setopen",id:a.id,open:v}).then(R=>{if(R&&R.ok){a.open=v;render();toast(v?"Reopened":"Closed: students can no longer send copies")}else toast("Not saved")}).catch(()=>toast("Not saved"));return}
  if(t.dataset.next!=null){e.preventDefault();cpSaveGrade(t.dataset.next==="1");return}
});
document.addEventListener("change",e=>{if(e.target.id==="caF"){$("#caCW").hidden=e.target.value!=="code"}});
document.addEventListener("submit",e=>{
  if(e.target.id==="cpKey"){e.preventDefault();const k=$("#cpk").value.trim();if(!k)return;try{localStorage.setItem("apMathTracker.qkey",k)}catch(x){}CP.err="";CP.data=null;render();return}
  if(e.target.id==="cpForm"){e.preventDefault();cpCreate();return}
  if(e.target.id==="aiForm"){e.preventDefault();const k=$("#aiK").value.trim();if(!k)return;
    cpPost({action:"setai",apiKey:k}).then(R=>{if(R&&R.ok){CP.data.aiReady=true;CP.aiSetup=false;render();toast("AI correction is ready")}else toast(R&&R.error==="apikey"?"This is not a Claude API key (it starts with sk-ant-)":"Not saved")}).catch(()=>toast("Not saved"));return}
  if(e.target.id==="cpKeyForm"){e.preventDefault();(async()=>{const id=e.target.dataset.id,f=$("#ckP").files[0];
    if(f&&f.size>10*1048576){toast("The PDF is larger than 10 MB");return}
    const txt=$("#ckT").value,pdf=f?await readPdf(f):"";$("#ckGo").disabled=true;
    let R=null;try{R=await cpPost({action:"setkey",id,answerKey:txt,pdf,pdfName:f?f.name:""})}catch(x){}
    if(R&&R.ok){const a=CP.data.assignments.find(x=>x.id===id);a.answerKey=txt;if(f)a.answerPdf=true;CP.keyEdit=null;render();toast("Answer key saved")}else{$("#ckGo").disabled=false;toast("Not saved")}})();return}
  if(e.target.id==="cpGrade"){e.preventDefault();cpSaveGrade(false);return}
},true);

boot();
/* the site's offline cache: check for a newer version, and reload once when it takes over */
try{if("serviceWorker" in navigator){navigator.serviceWorker.getRegistration().then(r=>{if(r)r.update()}).catch(()=>{});
  let swReloaded=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!swReloaded&&navigator.serviceWorker.controller){swReloaded=true;location.reload()}})}}catch(e){}
</script>

</body>
</html>
