<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="AP Precalculus, AP Calculus AB and SAT Math: guided notes, worksheets, quizzes and tests with automatic correction. Unit 1 and an SAT practice test are free.">
<title>AP Math Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
/* Layout: one column; tabs Courses / Quizzes / My access; same tokens as the teacher tracker */
:root{
  --bg:#EEF2F6; --paper:#FFFFFF; --grid:#DCE4EE; --ink:#16223A; --muted:#5B6880; --line:#CDD6E2;
  --accent:#2A55D9; --accent-ink:#FFFFFF; --hl:#F4C430; --bad:#C2412D; --good:#1F6F4A; --good-bg:#E3F2EA; --bad-bg:#FBE9E5; --lock:#7A5AF8;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --paper:#171F30; --grid:#1D2738; --ink:#E6ECF5; --muted:#93A0B8; --line:#2A3650;
  --accent:#7D9BFF; --accent-ink:#0F1522; --hl:#E8B92E; --bad:#F07560; --good:#5CC48E; --good-bg:#16352A; --bad-bg:#3D1F1A; --lock:#A894FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1522; --paper:#171F30; --grid:#1D2738; --ink:#E6ECF5; --muted:#93A0B8; --line:#2A3650;
  --accent:#7D9BFF; --accent-ink:#0F1522; --hl:#E8B92E; --bad:#F07560; --good:#5CC48E; --good-bg:#16352A; --bad-bg:#3D1F1A; --lock:#A894FF; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.6rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
p{margin:0}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
label.f{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input:not([type]){font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.spr input{font-family:var(--f-mono);font-size:1.15rem;max-width:260px;border-width:2px;border-radius:10px}
.spr input.right{border-color:var(--good);background:var(--good-bg)}.spr input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.banner{background:var(--hl);color:#16223A;border-radius:8px;padding:8px 12px;font-size:.9rem}
.err{color:var(--bad);font-weight:700;font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.course{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.course button{border:0;background:none;color:var(--ink);font:inherit;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer}
.course button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;background:none;font:inherit;color:var(--muted);font-weight:700;padding:8px 12px;margin-bottom:-2px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip.good{color:var(--good);border-color:var(--good)}.chip.mid{color:#9a6a00;border-color:var(--hl)}.chip.bad{color:var(--bad);border-color:var(--bad)}
.chip.free{background:var(--good);color:#fff;border-color:var(--good)}
.chip.lock{color:var(--lock);border-color:var(--lock)}
.chip.test{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.unit{border:1px solid var(--line);border-radius:10px;background:var(--paper)}
details.unit>summary{cursor:pointer;list-style:none;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
details.unit>summary::-webkit-details-marker{display:none}
details.unit>summary .t{flex:1;min-width:0;font-weight:700}
details.unit .body{padding:0 14px 14px;display:grid;gap:10px}
.lesson{display:grid;grid-template-columns:3.6em 1fr;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line)}
.lesson .ln{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:2px}
.res{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.rbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.84rem;font-weight:700;padding:5px 10px;border-radius:6px;cursor:pointer;text-decoration:none}
.rbtn .k{font-size:.64rem;letter-spacing:.06em;padding:1px 5px;border-radius:3px;background:var(--line);color:var(--ink)}
.rbtn.key .k{background:var(--hl);color:#16223A}
.rbtn.quiz{border-color:var(--good)}.rbtn.quiz .k{background:var(--good);color:#fff}
.rbtn.locked{color:var(--muted);border-style:dashed}
.pair{display:inline-flex;gap:4px;flex-wrap:nowrap}
.lockbox{border:1px dashed var(--lock);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.list{display:grid;gap:8px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.qrow small{grid-column:1;color:var(--muted);font-size:.82rem}
.qrow.locked{border-style:dashed;opacity:.85}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.calc{font-size:.7rem;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:4px;background:var(--line);color:var(--muted)}
.calc.on{background:var(--accent);color:var(--accent-ink)}
.stem{font-size:1.02rem;min-width:0;overflow-wrap:anywhere}
.tbl{overflow-x:auto;margin:8px 0}
.stem table,.exp table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.stem td,.exp td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.fig{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;justify-content:center}
.fig img{width:100%;max-width:460px;height:auto}
.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:2em 1fr;gap:8px;align-items:center;text-align:left;font:inherit;color:inherit;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:48px}
.choice .l{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice:disabled{cursor:default}
.exp{border-left:4px solid var(--good);background:var(--good-bg);padding:10px 12px;border-radius:0 8px 8px 0}
.exp.no{border-left-color:var(--bad);background:var(--bad-bg)}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font:inherit;font-family:var(--f-mono);font-size:.82rem;cursor:pointer;color:var(--ink)}
.dot.ans{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dot.cur{outline:3px solid var(--hl)}
.timer{font-family:var(--f-mono);font-weight:700;padding:4px 10px;border-radius:6px;background:var(--ink);color:var(--bg)}
.timer.low{background:var(--bad);color:#fff}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-weight:700;font-size:3rem;line-height:1}
.rev{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.confirm{border:2px solid var(--bad);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--paper)}
.offer{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--bg)}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--bg))}
.opt input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.price{font-family:var(--f-display);font-weight:700;font-size:1.3rem}
.steps{margin:0;padding-left:1.3em;display:grid;gap:6px}
.codebox{font-family:var(--f-mono);font-size:1.5rem;font-weight:700;letter-spacing:.06em;padding:10px 14px;border:2px dashed var(--accent);border-radius:10px;text-align:center;user-select:all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:700;font-size:.9rem;z-index:40}
.reader{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.reader .bar2{display:flex;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--paper);border-bottom:1px solid var(--line)}
.reader .rt{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader .scrollr{flex:1;overflow:auto;padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.reader .pages{display:grid;justify-items:center;gap:12px}
.reader .pg{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);max-width:100%}
.reader .pg canvas{width:100%;height:100%;display:block}
.reader .msg{max-width:480px;margin:40px auto;text-align:center;color:var(--muted)}
a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><div class="label">AP Precalculus · AP Calculus AB · SAT Math</div><h1>AP Math Online</h1></div>
    <div class="who" id="who"></div>
  </header>
  <div id="tabsWrap" hidden>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="courses">Courses</button>
      <button role="tab" data-tab="quizzes">Quizzes</button>
      <button role="tab" data-tab="access">My access</button>
    </nav>
  </div>
  <main id="main"><div class="panel"><p class="muted">Loading…</p></div></main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="reader" id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="rTitle">
  <div class="bar2">
    <button class="btn sm" id="rClose" aria-label="Close the document">← Back</button>
    <span class="rt" id="rTitle"></span>
    <span class="muted num" id="rPages" style="font-size:.8rem"></span>
    <button class="btn sm" id="zOut" aria-label="Zoom out">−</button>
    <button class="btn sm" id="zIn" aria-label="Zoom in">+</button>
    <a class="btn sm" id="rOpen" href="#" target="_blank" rel="noopener">Open</a>
  </div>
  <div class="scrollr" id="rScroll"><div class="pages" id="rWrap"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="../vendor/pdfjs/pdf.js"></script>
<script src="quiz-config.js?v=7"></script>
<script src="courses.js?v=9"></script>
<script src="quiz-bank.js?v=4"></script>
<script>
const CFG=window.QUIZ_CONFIG||{endpoint:""},PAY=CFG.payment||{},LIB=window.COURSE_LIB||{};
const FREE_BANK=window.QUIZ_BANK||[],LOCKED=window.QUIZ_LOCKED||[];
const COURSE={pc:"AP Precalculus",ab:"AP Calculus AB",sat:"SAT Math"},SHORT={pc:"Precalc",ab:"Calc AB",sat:"SAT"};
const online=!!CFG.endpoint;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem("apl."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("apl."+k,JSON.stringify(v))}catch(e){}}};
const S={id:LS.get("id",null),acc:LS.get("access",null),course:LS.get("course","pc"),tab:"courses",run:null,results:LS.get("results",{}),bank:{},open:LS.get("open",{})};
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
function math(el){try{renderMathInElement(el,{delimiters:[{left:"$",right:"$",display:false}],throwOnError:false})}catch(e){}}
function uid(){return (crypto.randomUUID&&crypto.randomUUID())||Date.now().toString(36)+Math.random().toString(36).slice(2)}
async function post(o){const r=await fetch(CFG.endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)});return r.json()}
const fmtMoney=n=>Number(n||0).toLocaleString("fr-FR")+" "+(PAY.currency||"FCFA");
const payReady=()=>online&&Object.values(PAY.prices||{}).some(p=>p>0)&&(PAY.wave||PAY.orangeMoney);

/* ---------- access and keys ---------- */
const keys=()=>(S.acc&&S.acc.keys)||{};
const unitOpen=(c,u)=>!!(u.free||keys()[c+"-"+u.id]);
async function refreshAccess(){
  if(!online||!S.id||!S.id.code)return;
  try{const R=await post({action:"access",code:S.id.code});
    if(R&&R.ok){S.acc={type:R.type,status:R.status,courses:R.courses,requested:R.requested,keys:R.keys||{},accessEnds:R.accessEnds,at:Date.now()};
      if(R.type==="student"&&R.name)S.id.name=R.name;LS.set("id",S.id);LS.set("access",S.acc);S.bank={}}
    else if(R&&R.error==="code"){S.acc={type:"none",status:"Unknown",courses:[],keys:{}};LS.set("access",S.acc)}
  }catch(e){}
}
const b64u=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
async function decrypt(buf,k){const key=await crypto.subtle.importKey("raw",b64u(k),"AES-GCM",false,["decrypt"]);const b=new Uint8Array(buf);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},key,b.slice(12)))}
async function lockedQuizzes(unitKey,file){
  if(S.bank[unitKey])return S.bank[unitKey];
  const k=keys()[unitKey];if(!k)return null;
  const r=await fetch(file);if(!r.ok)throw new Error("fetch");
  return S.bank[unitKey]=JSON.parse(new TextDecoder().decode(await decrypt(await r.arrayBuffer(),k)));
}

/* ---------- results (queued when offline) ---------- */
async function flush(){
  if(!online)return;const q=LS.get("pending",[]);if(!q.length)return;const left=[];
  for(const p of q){try{const R=await post(p);if(!(R&&R.ok))left.push(p)}catch(e){left.push(p)}}
  LS.set("pending",left);
}
async function send(payload){
  if(!online)return "practice";
  if(!S.id||!S.id.code)return "guest";
  if(S.acc&&S.acc.type==="teacher")return "teacher";
  try{const R=await post(payload);if(R&&R.ok)return "sent";if(R&&R.error==="code")return "code";throw 0}
  catch(e){const q=LS.get("pending",[]);q.push(payload);LS.set("pending",q);return "queued"}
}

/* ---------- header and tabs ---------- */
function statusChip(){
  const a=S.acc;if(!S.id)return "";
  if(a&&a.type==="teacher")return '<span class="chip good">Teacher · all units</span>';
  if(a&&a.status==="Pending")return '<span class="chip mid">Payment being checked</span>';
  if(a&&(a.courses||[]).length)return `<span class="chip good">Full access · ${a.courses.map(c=>SHORT[c]||c).join(" + ")}</span>`;
  return '<span class="chip">Free samples</span>';
}
function header(){
  $("#who").innerHTML=S.id?`<span>${esc(S.id.name||"Guest")}</span>${statusChip()}<button class="btn sm" id="signout">Sign out</button>`:"";
  $("#tabsWrap").hidden=!S.id||!!S.run;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
}
function courseSwitch(){return `<div class="course" role="group" aria-label="Course">${Object.keys(COURSE).map(c=>`<button data-course="${c}" aria-pressed="${c===S.course}">${COURSE[c]}</button>`).join("")}</div>`}
function render(){
  header();
  if(!S.id)return signin();
  if(S.tab==="quizzes")return quizzesView();
  if(S.tab==="access")return accessView();
  return coursesView();
}

/* ---------- sign in ---------- */
function signin(msg,nm,cc){
  header();
  $("#main").innerHTML=`<div class="panel">
    <h2>Welcome</h2>
    <p class="muted">Guided notes, worksheets, quizzes and tests for AP Precalculus, AP Calculus AB and SAT Math. <b>Unit 1 of each AP course, one SAT skill and a full SAT practice test are free.</b></p>
    ${online?"":'<div class="banner"><b>Practice mode.</b> The free content is open; accounts and payments are not active yet.</div>'}
    <form id="si" style="display:grid;gap:12px">
      <label class="f" for="nm">Your full name<input id="nm" autocomplete="name" maxlength="60" value="${esc(nm??S.id?.name??"")}"></label>
      <label class="f" for="cc">Access code or class code (leave empty to try the free content)<input id="cc" autocomplete="off" autocapitalize="characters" maxlength="30" value="${esc(cc??"")}"></label>
      ${msg?`<div class="err">${esc(msg)}</div>`:""}
      <button class="btn primary" type="submit" id="go">Continue</button>
    </form>
    ${online?`<p class="muted" style="font-size:.9rem">No code yet? Continue with your name, then open <b>My access</b> to get full access.</p>`:""}
  </div>`;
}
async function doSignin(name,code){
  if(!code){if(!name)return signin("Enter your name.",name,code);S.id={name,code:"",kind:"guest"};S.acc=null;LS.set("id",S.id);LS.set("access",null);return route()}
  if(!online){S.id={name:name||"Student",code:"",kind:"guest"};LS.set("id",S.id);toast("Accounts are not active yet: the free content is open");return route()}
  $("#go").disabled=true;$("#go").textContent="Checking…";
  try{const R=await post({action:"access",code});
    if(!R||!R.ok)return signin("This code is not recognized. Check it, or continue without a code.",name,code);
    if(R.type!=="student"&&R.type!=="teacher"&&!name)return signin("Enter your name.",name,code);
    S.id={name:R.type==="student"?R.name:(R.type==="teacher"?"Teacher":name),code,kind:R.type};
    S.acc={type:R.type,status:R.status,courses:R.courses,requested:R.requested,keys:R.keys||{},accessEnds:R.accessEnds,at:Date.now()};
    LS.set("id",S.id);LS.set("access",S.acc);S.bank={};flush();route()}
  catch(e){signin("No connection. Check your internet and try again.",name,code)}
}

/* ---------- courses ---------- */
function pdfPath(c,f,locked){return "docs/"+c+"/"+f+".pdf"+(locked?".enc":"")}
const unitName=(c,u)=>u.n==="R"||u.n==="T"?u.t:(c==="sat"?"Domain ":"Unit ")+u.n+" · "+u.t;
const someFree=u=>!!(u.free||(u.lessons||[]).some(l=>l.free));
function fileBtn(c,u,f,label,cls,k){
  const locked=!u.free,open=unitOpen(c,u);
  if(locked&&!open)return `<span class="rbtn locked" title="Full access">${k?`<span class="k">${k}</span>`:""}${label} 🔒</span>`;
  return `<button class="rbtn ${cls||""}" data-pdf="${esc(pdfPath(c,f,locked))}" data-unit="${esc(c+"-"+u.id)}" data-title="${esc(label)}">${k?`<span class="k">${k}</span>`:""}${label}</button>`;
}
function quizBtn(c,qid){
  const free=FREE_BANK.find(q=>q.id===qid),lk=LOCKED.find(q=>q.id===qid);
  if(!free&&!lk)return "";
  return `<button class="rbtn quiz" data-quiz="${esc(qid)}"><span class="k">ONLINE</span>Quiz${(lk&&!keys()[lk.key])?" 🔒":""}</button>`;
}
function unitBody(c,u){
  if(!u.plan&&!u.files)return `<p class="muted">Coming soon. Lessons in this unit:</p><div>${u.lessons.map(l=>`<div class="lesson"><span class="ln">${esc(l.n)}</span><span>${esc(l.t)}</span></div>`).join("")}</div>`;
  const open=unitOpen(c,u),lab=l=>l.review?l.t:(c==="pc"?"Topic ":"Lesson ")+l.n;
  let h="";
  const fl=(u.lessons||[]).filter(l=>l.free);
  if(!open)h+=`<div class="lockbox"><span>This ${c==="sat"?"domain":"unit"} is part of <b>full access</b> to ${COURSE[c]}.${fl.length?` ${c==="sat"?"Skill":"Lesson"} ${fl.map(l=>esc(l.n)).join(", ")} is free.`:""}</span><button class="btn sm primary" data-tab="access">Get full access</button></div>`;
  const uq=c+"-"+u.id+"-aptest";
  const top=[];
  if(u.files&&u.files.notes)top.push(fileBtn(c,u,u.files.notes,"Unit notes","", "NOTES"));
  if(u.files&&u.files.practice)top.push(fileBtn(c,u,u.files.practice,"AP practice (MCQ + FRQ)","","PDF"),fileBtn(c,u,u.files.key,"Answer key","key","KEY"));
  if(FREE_BANK.some(q=>q.id===uq)||LOCKED.some(q=>q.id===uq))top.push(`<button class="rbtn quiz" data-quiz="${esc(uq)}"><span class="k">ONLINE</span>Unit test${LOCKED.some(q=>q.id===uq&&!keys()[q.key])?" 🔒":""}</button>`);
  if(top.length)h+=`<div class="res" style="grid-column:auto">${top.join("")}</div>`;
  if(u.tests)h+=`<div class="label">Self checks and unit tests</div><div class="res" style="grid-column:auto">${u.tests.map(x=>`<span class="pair">${fileBtn(c,u,u.plan+x.id,x.t)}${fileBtn(c,u,u.plan+x.id+"-key","Key","key","KEY")}${quizBtn(c,c+"-"+u.plan+x.id)}</span>`).join("")}</div>`;
  if(u.mocks)h+=`<div class="label">Online adaptive tests (Module 1, then an easier or harder Module 2, with an estimated score)</div><div class="res" style="grid-column:auto">${u.mocks.map(m=>`<button class="rbtn quiz" data-quiz="${esc(m.id)}"><span class="k">ONLINE</span>${esc(m.t)}${m.note?` · ${esc(m.note)}`:""}${LOCKED.some(q=>q.id===m.id&&!keys()[q.key])?" 🔒":""}</button>`).join("")}</div><div class="label">Paper versions</div>`;
  if(u.plan&&u.lessons.length){

      if(l.notes)parts.push(fileBtn(c,u,base+"-notes","Notes"),fileBtn(c,u,base+"-notes-filled","Filled notes"));

      u=u0;

  }

}

/* ---------- PDF reader ---------- */
const pdfLib=window.pdfjsLib;if(pdfLib)pdfLib.GlobalWorkerOptions.workerSrc="../vendor/pdfjs/pdf.worker.js";
let pdoc=null,zoom=1,pobs=null,ptoken=0,lastFocus=null,blobUrl=null;
function baseWidth(){return Math.min(900,$("#rScroll").clientWidth-24)*zoom}
async function openPdf(url,title,unit){
  lastFocus=document.activeElement;
  $("#rTitle").textContent=title;$("#rPages").textContent="";$("#rOpen").hidden=true;
  const wrap=$("#rWrap");wrap.innerHTML='<div class="msg">Loading document…</div>';
  $("#reader").hidden=false;document.body.style.overflow="hidden";$("#rClose").focus();
  zoom=1;const my=++ptoken;if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=null}
  let data;
  try{const r=await fetch(url);if(!r.ok)throw new Error("http");data=new Uint8Array(await r.arrayBuffer())}
  catch(e){if(my===ptoken)wrap.innerHTML='<div class="msg">This document could not be loaded. Check your connection and try again.</div>';return}
  if(url.endsWith(".enc")){const k=keys()[unit];if(!k){wrap.innerHTML='<div class="msg">This document is part of full access.</div>';return}
    try{data=await decrypt(data,k)}catch(e){if(my===ptoken)wrap.innerHTML='<div class="msg">This document could not be unlocked. Sign out, then sign in again with your access code.</div>';return}}
  if(my!==ptoken)return;
  blobUrl=URL.createObjectURL(new Blob([data],{type:"application/pdf"}));$("#rOpen").href=blobUrl;$("#rOpen").download=title.replace(/[^\w.-]+/g,"_")+".pdf";$("#rOpen").hidden=false;
  if(!pdfLib){wrap.innerHTML='<div class="msg">The built-in reader could not start in this browser. Use Open to view the PDF.</div>';return}
  try{pdoc=await pdfLib.getDocument({data:data.slice()}).promise;if(my!==ptoken)return;$("#rPages").textContent=pdoc.numPages+" p.";layoutPdf()}
  catch(e){wrap.innerHTML='<div class="msg">The built-in reader could not display this document. Use Open to view the PDF.</div>'}
}
async function layoutPdf(){
  if(pobs)pobs.disconnect();const wrap=$("#rWrap");wrap.innerHTML="";
  const first=await pdoc.getPage(1),vp=first.getViewport({scale:1}),w=baseWidth(),h=w*vp.height/vp.width;
  for(let i=1;i<=pdoc.numPages;i++){const d=document.createElement("div");d.className="pg";d.style.width=w+"px";d.style.height=h+"px";d.dataset.p=i;wrap.appendChild(d)}
  pobs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target.dataset.done){e.target.dataset.done=1;drawPage(e.target)}}),{root:$("#rScroll"),rootMargin:"600px 0px"});
  wrap.querySelectorAll(".pg").forEach(d=>pobs.observe(d));
}
async function drawPage(div){
  if(!pdoc)return;const page=await pdoc.getPage(+div.dataset.p);
  const w=parseFloat(div.style.width),vp0=page.getViewport({scale:1}),dpr=Math.min(window.devicePixelRatio||1,2.5);
  const vp=page.getViewport({scale:w/vp0.width*dpr});const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;
  div.style.height=(w*vp0.height/vp0.width)+"px";div.appendChild(cv);
  await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
}
function closeReader(){$("#reader").hidden=true;document.body.style.overflow="";ptoken++;if(pobs)pobs.disconnect();$("#rWrap").innerHTML="";if(pdoc){pdoc.destroy();pdoc=null}if(lastFocus&&lastFocus.focus)lastFocus.focus()}
$("#rClose").addEventListener("click",closeReader);
$("#zIn").addEventListener("click",()=>{if(pdoc){zoom=Math.min(2.5,zoom*1.25);layoutPdf()}});
$("#zOut").addEventListener("click",()=>{if(pdoc){zoom=Math.max(.5,zoom/1.25);layoutPdf()}});

/* ---------- running a quiz or test ---------- */
async function findQuiz(id){
  const f=FREE_BANK.find(b=>b.id===id);if(f)return f;
  const lk=LOCKED.find(b=>b.id===id);if(!lk)return null;
  if(!keys()[lk.key])return "locked";
  try{const qs=await lockedQuizzes(lk.key,lk.file);return qs.find(b=>b.id===id)||null}catch(e){toast("Could not load this quiz. Check your connection.");return null}
}
/* student-produced responses: "3/4", "0.75", "−2" and "2,5" are read as numbers and compared with every accepted value */
function num(x){x=String(x??"").trim().replace(/[\u2212\u2013]/g,"-").replace(/,/g,".").replace(/\s+/g,"");if(!x)return NaN;
  const m=x.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);if(m)return +m[2]?(+m[1])/(+m[2]):NaN;return /^-?\d*\.?\d+$/.test(x)?+x:NaN}
function isRight(it,a){if(a==null||a==="")return false;if(it.spr){const v=num(a);return !isNaN(v)&&it.spr.some(s=>Math.abs(num(s)-v)<=0.001)}return a===it.a}
const shown=(it,a)=>a==null||a===""?"none":it.spr?esc(a):"("+"ABCD"[a]+")";
const correct=it=>it.spr?it.ans:"("+"ABCD"[it.a]+") "+it.c[it.a];
/* SAT adaptive test: Module 1, then the harder Module 2 if at least b.cut answers are right, otherwise the easier one */
function modBlock(b,m){return {...b,kind:"test",mock:b,mod:m,items:b.modules[m],title:b.title.split(" · ")[0]+" · "+(m==="m1"?"Module 1":"Module 2"+(m==="hard"?" (harder)":" (easier)"))}}
function satScore(total,hard){const v=hard?400+400*(total-13)/31:200+400*total/34;return Math.max(200,Math.min(800,Math.round(v/10)*10))}
async function start(id){
  const b=await findQuiz(id);
  if(b==="locked"){S.tab="access";toast("This quiz is part of full access");return render()}
  if(!b)return render();
  S.course=b.course;
  const saved=LS.get("run",null);
  if(b.kind==="sat"){
    if(saved&&saved.id===id&&Date.now()<saved.end)S.run={...saved,b:modBlock(b,saved.mod)};
    else S.run={id,b:modBlock(b,"m1"),mod:"m1",i:0,ans:Array(b.modules.m1.length).fill(null),lock:[],t0:Date.now(),end:Date.now()+b.minutes*60000,confirm:false};
    try{history.replaceState(null,"","#"+id)}catch(e){}
    return S.run.brk?breakView():view();
  }
  if(saved&&saved.id===id&&b.kind==="test"&&Date.now()<saved.end)S.run={...saved,b};
  else S.run={id,b,i:0,ans:Array(b.items.length).fill(null),lock:Array(b.items.length).fill(false),t0:Date.now(),end:b.minutes?Date.now()+b.minutes*60000:0,confirm:false};
  try{history.replaceState(null,"","#"+id)}catch(e){}
  view();
}
function save(){if(S.run&&S.run.b.kind==="test"){const {b,...r}=S.run;LS.set("run",r)}}

function view(){

    ${it.img.map(src=>`<div class="fig"><img src="quiz-img/${src}" alt="Graph for question ${R.i+1}"></div>`).join("")}
    ${it.spr?`<label class="f spr" for="sprIn">Your answer <span class="muted" style="font-weight:400">(a number, a fraction like 3/4, or a decimal)</span>
      <input id="sprIn" inputmode="text" autocomplete="off" maxlength="12" value="${esc(R.ans[R.i]??"")}" ${!test&&R.lock[R.i]?"disabled":""} class="${!test&&R.lock[R.i]?(isRight(it,R.ans[R.i])?"right":"wrong"):""}"></label>`
    :`<div class="choices">${it.c.map((c,k)=>{let cls="";if(!test&&R.lock[R.i]){if(k===it.a)cls="right";else if(k===R.ans[R.i])cls="wrong"}
      return `<button class="choice ${cls}" data-pick="${k}" aria-pressed="${R.ans[R.i]===k}" ${!test&&R.lock[R.i]?"disabled":""}><span class="l">${"ABCD"[k]}</span><span>${c}</span></button>`}).join("")}</div>`}
    ${!test&&R.lock[R.i]?`<div class="exp ${isRight(it,R.ans[R.i])?"":"no"}"><b>${isRight(it,R.ans[R.i])?"Correct.":"Not quite. The answer is "+(it.spr?it.ans:"("+"ABCD"[it.a]+")")+"."}</b> ${it.e}</div>`:""}
    ${test?`<div class="dots">${b.items.map((_,k)=>`<button class="dot ${R.ans[k]!=null&&R.ans[k]!==""?"ans":""} ${k===R.i?"cur":""}" data-go="${k}" aria-label="Question ${k+1}">${k+1}</button>`).join("")}</div>`:""}
    ${R.confirm?`<div class="confirm"><b>${b.mock&&b.mod==="m1"?"Finish Module 1?":"Submit your test?"}</b><span>${n-answered?`You have ${n-answered} unanswered question${n-answered>1?"s":""}. Unanswered questions count as wrong.`:"All questions are answered."}</span><div class="nav"><button class="btn" id="cancel">Keep working</button><button class="btn primary" id="finish">${b.mock&&b.mod==="m1"?"Go on":"Submit test"}</button></div></div>`:""}
    <div class="nav">
      ${test?`<button class="btn" id="prev" ${R.i===0?"disabled":""}>Previous</button>`:"<span></span>"}
      ${test?(R.i<n-1?`<button class="btn primary" id="next">Next</button>`:`<button class="btn primary" id="ask">${b.mock&&b.mod==="m1"?"Finish Module 1":"Submit test"}</button>`)
            :(R.lock[R.i]?`<button class="btn primary" id="next">${R.i<n-1?"Next question":"See my score"}</button>`:`<button class="btn primary" id="check" ${R.ans[R.i]==null||R.ans[R.i]===""?"disabled":""}>Check answer</button>`)}
    </div></div>`;
  math($("#main"));
  const si=$("#sprIn");if(si){if(!(!test&&R.lock[R.i]))si.focus({preventScroll:true});si.addEventListener("input",()=>{R.ans[R.i]=si.value.trim();save();const c=$("#check");if(c)c.disabled=!R.ans[R.i];
    const d=document.querySelector(`.dot[data-go="${R.i}"]`);if(d)d.classList.toggle("ans",!!R.ans[R.i])});
    si.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const c=$("#check")||$("#next");if(c&&!c.disabled)c.click()}})}
  if(test){const upd=()=>{const left=Math.max(0,R.end-Date.now()),m=Math.floor(left/60000),s=Math.floor(left/1000)%60;const el=$("#tm");if(el){el.textContent=`${m}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",left<60000)}if(left<=0){clearInterval(tick);finish(true)}};upd();tick=setInterval(upd,1000)}
  window.scrollTo({top:0});
}
const ansText=(items,ans)=>items.map((it,k)=>ans[k]==null||ans[k]===""?"-":it.spr?"{"+ans[k]+"}":"ABCD"[ans[k]]).join("");
async function finish(timeUp){
  clearInterval(tick);
  let R=S.run,b=R.b;
  if(b.mock&&b.mod==="m1"){   // end of Module 1: route to Module 2
    const r1=b.items.reduce((s,it,k)=>s+(isRight(it,R.ans[k])?1:0),0),m=r1>=b.mock.cut?"hard":"easy";
    S.run={id:R.id,b:modBlock(b.mock,m),mod:m,m1:{ans:R.ans,right:r1},i:0,ans:Array(b.mock.modules[m].length).fill(null),lock:[],t0:R.t0,end:Date.now()+3600000,brk:true,confirm:false};
    save();return breakView();
  }
  if(b.mock){   // end of Module 2: one result for the whole test
    const mk=b.mock,i1=mk.modules.m1,items=[...i1,...b.items],ans=[...R.m1.ans,...R.ans];
    R={...R,ans,timeUp,r1:R.m1.right};b={...mk,items,mod:b.mod};
  }
  const n=b.items.length;
  const right=b.items.reduce((s,it,k)=>s+(isRight(it,R.ans[k])?1:0),0),pct=Math.round(100*right/n);
  const sat=b.mod?satScore(right,b.mod==="hard"):0;
  const prev=S.results[b.id]||{best:0,tries:0};S.results[b.id]={best:Math.max(prev.best,pct),last:pct,tries:prev.tries+1,at:new Date().toISOString(),...(sat?{sat:Math.max(sat,prev.sat||0)}:{})};LS.set("results",S.results);
  LS.set("run",null);S.run=R;
  const title=sat?`${b.title.split(" · ")[0]} · estimated ${sat} (Module 2 ${b.mod==="hard"?"harder":"easier"})`:b.title;
  const payload={action:"submit",id:uid(),name:S.id.name,code:S.id.code,course:b.course,unit:b.unit,quiz:b.id,title,kind:b.kind,score:right,total:n,percent:pct,seconds:Math.round((Date.now()-R.t0)/1000),answers:ansText(b.items,R.ans),client:new Date().toISOString()};
  results(b,R,right,pct,timeUp,"sending",sat);
  const st=await send(payload);const el=$("#sendst");if(el)el.innerHTML=sendText(st);
}
function sendText(st){return {practice:"Practice mode: this result was not sent.",guest:"Saved on this device only. Sign in with a code to send your results to your teacher.",teacher:"Teacher preview: not recorded.",sent:"✓ Sent to your teacher.",queued:"Saved on this device. It will be sent when you are online.",code:"Your code was refused. Sign out and sign in again.",sending:"Sending to your teacher…"}[st]}
function satReport(b,R,right,sat){
  const doms={};b.items.forEach((it,k)=>{const d=it.topic||"Other";doms[d]=doms[d]||[0,0];doms[d][1]++;if(isRight(it,R.ans[k]))doms[d][0]++});
  return `<div class="score"><span class="big num">${sat}</span><span>estimated SAT Math score<br><b class="num">${right}</b> of <b class="num">${b.items.length}</b> correct</span></div>
    <p class="muted" style="font-size:.9rem">Module 1: <b class="num">${R.r1}</b> of ${b.modules.m1.length} correct, so Module 2 was the <b>${b.mod==="hard"?"harder":"easier"}</b> one${b.mod==="hard"?"":" (the easier module caps the score near 600)"}. This estimate is only indicative: the College Board uses its own scoring for each test form.</p>
    <div class="tbl"><table><tr><td><b>Domain</b></td><td><b>Correct</b></td></tr>${Object.entries(doms).map(([d,[a,t]])=>`<tr><td>${esc(d)}</td><td class="num">${a} / ${t}</td></tr>`).join("")}</table></div>`;
}
function results(b,R,right,pct,timeUp,st,sat){
  const n=b.items.length;
  $("#main").innerHTML=`<div class="panel">
    <div class="label">${esc(sat?b.title.split(" · ")[0]:b.title)}</div>
    ${timeUp?'<div class="banner">Time is up. Your test was submitted automatically.</div>':""}
    ${sat?satReport(b,R,right,sat):`<div class="score"><span class="big num">${pct}%</span><span><b class="num">${right}</b> of <b class="num">${n}</b> correct</span></div>`}
    <div class="muted" id="sendst">${sendText(st)}</div>
    <div class="nav"><button class="btn" id="back">All quizzes</button>${b.kind==="quiz"?`<button class="btn primary" id="again">Try again</button>`:""}</div>
    <h2>Corrections</h2>
    ${b.items.map((it,k)=>{const ok=isRight(it,R.ans[k]),m1=sat?b.modules.m1.length:0;return `${sat&&k===0?"<h3>Module 1</h3>":""}${sat&&k===m1?`<h3>Module 2 (${b.mod==="hard"?"harder":"easier"})</h3>`:""}<div class="rev"><div class="qhead"><b>Question ${sat&&k>=m1?k-m1+1:k+1}</b>${it.topic&&sat?`<span class="muted" style="font-size:.85rem">${esc(it.topic)}</span>`:""}<span class="chip ${ok?"good":"bad"}">${ok?"Correct":R.ans[k]==null||R.ans[k]===""?"No answer":"Incorrect"}</span></div>
      <div class="stem">${it.q}</div>${it.img.map(src=>`<div class="fig"><img src="quiz-img/${src}" alt="Graph for question ${k+1}" loading="lazy"></div>`).join("")}
      <div class="muted">Your answer: <b>${shown(it,R.ans[k])}</b> · Correct answer: <b>${correct(it)}</b></div>
      <div class="exp ${ok?"":"no"}">${it.e}</div></div>`}).join("")}
  </div>`;
  math($("#main"));window.scrollTo({top:0});
  try{history.replaceState(null,"","#")}catch(e){}
}

/* ---------- events ---------- */
document.addEventListener("submit",e=>{e.preventDefault();
  if(e.target.id==="si")doSignin($("#nm").value.trim().replace(/\s+/g," "),$("#cc").value.trim().toUpperCase());
  if(e.target.id==="buy")doBuy();
});
document.addEventListener("change",e=>{if(e.target.name==="crs"||e.target.name==="mth"){readBuy();accessView()}});
document.addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("unit")){S.open[d.dataset.k]=d.open;LS.set("open",S.open)}},true);
document.addEventListener("click",async e=>{
  const pb=e.target.closest("[data-pdf]");if(pb){openPdf(pb.dataset.pdf,pb.dataset.title,pb.dataset.unit);return}
  const t=e.target.closest("button");if(!t)return;
  if(t.id==="signout"){S.id=null;S.acc=null;S.run=null;LS.set("id",null);LS.set("access",null);S.bank={};return render()}
  if(t.dataset.tab){if(S.run)return;S.tab=t.dataset.tab;try{history.replaceState(null,"","#"+S.tab)}catch(e){}if(S.tab==="access"&&S.acc&&S.acc.status==="Pending")await refreshAccess();return render()}
  if(t.dataset.course){S.course=t.dataset.course;LS.set("course",S.course);return render()}
  if(t.dataset.quiz)return start(t.dataset.quiz);
  if(t.id==="recheck"){t.disabled=true;await refreshAccess();toast(S.acc&&S.acc.status==="Active"?"Full access is active":"Not confirmed yet");return render()}
  if(t.id==="haveCode"){S.id=null;LS.set("id",null);return signin("Enter the access code you received.")}
  const R=S.run;if(!R)return;
  if(t.dataset.pick!=null){if(R.b.kind==="quiz"&&R.lock[R.i])return;R.ans[R.i]=+t.dataset.pick;save();return view()}
  if(t.id==="check"){R.lock[R.i]=true;return view()}
  if(t.id==="next"){if(R.b.kind==="quiz"&&R.i===R.b.items.length-1)return finish(false);R.i++;R.confirm=false;save();return view()}
  if(t.id==="prev"){R.i--;R.confirm=false;return view()}
  if(t.dataset.go!=null){R.i=+t.dataset.go;save();return view()}
  if(t.id==="ask"){R.confirm=true;return view()}
  if(t.id==="cancel"){R.confirm=false;return view()}
  if(t.id==="finish")return finish(false);
  if(t.id==="mod2"){R.brk=false;R.end=Date.now()+R.b.mock.minutes*60000;R.t0=R.t0||Date.now();save();return view()}
  if(t.id==="quit"){clearInterval(tick);if(R.b.kind==="test")save();if(R.b.mock)toast("Your test is saved until its timer ends");S.run=null;S.tab="quizzes";try{history.replaceState(null,"","#")}catch(e){};return render()}
  if(t.id==="again")return start(R.id||R.b.id);
  if(t.id==="back"){S.run=null;S.tab="quizzes";return render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#reader").hidden)closeReader()});
window.addEventListener("online",flush);
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(["courses","quizzes","access"].includes(h)){S.tab=h;return render()}
  if(h&&(FREE_BANK.some(b=>b.id===h)||LOCKED.some(b=>b.id===h))&&S.id)return start(h);
  const saved=LS.get("run",null);
  if(S.id&&saved&&saved.end&&Date.now()<saved.end)return start(saved.id);
  render();
}
window.addEventListener("hashchange",()=>{if(!S.run)route()});
(async function(){
  route();
  if(S.id&&S.id.code){await refreshAccess();if(!S.run)render()}
  flush();
  try{if("serviceWorker" in navigator){navigator.serviceWorker.getRegistration().then(r=>{if(r)r.update()}).catch(()=>{});
    let re=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!re&&navigator.serviceWorker.controller&&!S.run){re=true;location.reload()}})}}catch(e){}
})();
</script>
</body>
</html>
