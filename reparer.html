<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mise à jour du site</title>
<style>
:root{--bg:#f5f7f9;--fg:#1d2733;--accent:#1F7A8C;--muted:#5b6876}
@media (prefers-color-scheme:dark){:root{--bg:#121820;--fg:#e8edf2;--accent:#4fb3c4;--muted:#9aa7b4}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
main{max-width:480px;text-align:center;display:grid;gap:12px}
h1{font-size:1.3rem;margin:0}p{margin:0;color:var(--muted)}a{color:var(--accent);font-weight:600}
</style></head>
<body><main>
<h1>Mise à jour du site…</h1>
<p id="m">Suppression des anciennes copies gardées par le navigateur.</p>
</main>
<script>
/* Remet le site à neuf sur cet appareil : supprime les copies hors connexion des pages et du programme
   (les documents PDF enregistrés et les mesures en cours sont conservés), puis rouvre la page d'où l'on vient (par défaut, la page des TP). */
(async function () {
  const m = document.getElementById("m");
  try {
    if ("serviceWorker" in navigator) { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.unregister())); }
    if ("caches" in window) { const ks = await caches.keys(); await Promise.all(ks.filter(k => !k.startsWith("pdf")).map(k => caches.delete(k))); }
    m.innerHTML = "C'est fait. Retour à la page…";
  } catch (e) { m.textContent = "Remise à jour partielle (" + e.message + ")."; }
  // page de retour : uniquement une page de ce site (nom simple en .html)
  let retour = new URLSearchParams(location.search).get("retour") || "tp.html";
  if (!/^(labo\/)?[a-z0-9_-]+\.html$/i.test(retour) || retour === "reparer.html") retour = "tp.html";
  setTimeout(() => { location.replace(retour + "?maj=" + Date.now()); }, 800);
})();
</script>
</body></html>
